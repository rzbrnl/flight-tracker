    </svg>

    <!-- Top Bar -->
    <header id="topbar">
      <div class="logo">
        <svg class="icon" width="20" height="20"><use href="#icon-logo"></use></svg>
        <span>SkyView</span>
      </div>

      <div class="search-wrapper">
        <div class="search-box">
          <svg class="icon search-icon" width="14" height="14"><use href="#icon-search"></use></svg>
          <input type="text" id="search" placeholder="Search flights, airports..." autocomplete="off" />
        </div>
      </div>

      <div class="top-actions">
        <button class="top-btn" id="btn-filters" title="Filters">
          <svg class="icon" width="18" height="18"><use href="#icon-filter"></use></svg>
        </button>
        <button class="top-btn" id="btn-settings" title="Settings">
          <svg class="icon" width="18" height="18"><use href="#icon-settings"></use></svg>
        </button>
      </div>
    </header>

    <!-- Map -->
    <div id="map"></div>

    <!-- Side Panel -->
    <aside id="sidebar" class="hidden">
      <div class="sidebar-header">
        <span style="font-size: 13px; color: var(--text-muted);">Flight Details</span>
        <button id="close-sidebar" class="close-btn">
          <svg class="icon" width="14" height="14"><use href="#icon-close"></use></svg>
        </button>
      </div>

      <div class="flight-card">
        <div class="flight-route">
          <div>
            <div class="airport-code" id="origin-code">---</div>
            <div class="airport-name" id="origin-name">Origin</div>
          </div>
          <div class="route-line">
            <svg class="icon" width="12" height="12"><use href="#icon-logo"></use></svg>
          </div>
          <div style="text-align: right;">
            <div class="airport-code" id="dest-code">---</div>
            <div class="airport-name" id="dest-name">Destination</div>
          </div>
        </div>

        <div class="flight-number">
          <svg class="icon" width="16" height="16"><use href="#icon-ticket"></use></svg>
          <span id="callsign">---</span>
          <span style="margin-left: auto; color: var(--text-muted); font-size: 11px;" id="country">---</span>
        </div>

        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-label">
              <svg class="icon" width="12" height="12"><use href="#icon-speed"></use></svg>
              Speed
            </div>
            <div class="stat-value" id="velocity">--- km/h</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">
              <svg class="icon" width="12" height="12"><use href="#icon-altitude"></use></svg>
              Altitude
            </div>
            <div class="stat-value" id="altitude">--- m</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">
              <svg class="icon" width="12" height="12"><use href="#icon-compass"></use></svg>
              Heading
            </div>
            <div class="stat-value" id="heading">---°</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">
              <svg class="icon" width="12" height="12"><use href="#icon-vertical"></use></svg>
              Vertical
            </div>
            <div class="stat-value" id="vertical-rate">--- m/s</div>
          </div>
        </div>

        <button class="more-info-btn" id="btn-more-info">
          <svg class="icon" width="14" height="14"><use href="#icon-ticket"></use></svg>
          More information
        </button>

        <div id="advanced-info" style="display: none; margin-top: 12px;">
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-label">
                <svg class="icon" width="12" height="12"><use href="#icon-speed"></use></svg>
                Squawk
              </div>
              <div class="stat-value" id="squawk">---</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">
                <svg class="icon" width="12" height="12"><use href="#icon-compass"></use></svg>
                ICAO24
              </div>
              <div class="stat-value mono" id="icao24">---</div>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Bottom Bar -->
    <footer id="bottombar">
      <div class="bottom-stat">
        <svg class="icon" width="14" height="14"><use href="#icon-logo"></use></svg>
        <span class="value" id="plane-count">0</span>
        <span>flights</span>
      </div>
      <div class="bottom-stat">
        <svg class="icon" width="14" height="14"><use href="#icon-airport"></use></svg>
        <span class="value">20</span>
        <span>airports</span>
      </div>
      <div class="bottom-stat live">
        <svg class="icon live-icon" width="14" height="14"><use href="#icon-live"></use></svg>
        <span class="value" id="data-source">Live</span>
      </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/api.js?v=13"></script>
    <script src="js/aircraft.js?v=13"></script>
    <script src="js/map.js?v=13"></script>
    <script src="js/app.js?v=13"></script>
  </body>
</html>
