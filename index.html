<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vuelos</title>
    <link rel="stylesheet" href="css/style.css?v=3" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300d4ff'><path d='M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z'/></svg>"
    />
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <div id="sidebar" class="sidebar hidden">
        <button id="close-sidebar" class="close-btn">&times;</button>
        <div id="flight-info">
          <div class="flight-header">
            <span class="callsign" id="callsign">---</span>
            <span class="country" id="country">---</span>
          </div>
          <div class="flight-details">
            <div class="detail-row">
              <span class="label">Altitud</span>
              <span class="value" id="altitude">--- m</span>
            </div>
            <div class="detail-row">
              <span class="label">Velocidad</span>
              <span class="value" id="velocity">--- km/h</span>
            </div>
            <div class="detail-row">
              <span class="label">Dirección</span>
              <span class="value" id="heading">---°</span>
            </div>
            <div class="detail-row">
              <span class="label">Vertical</span>
              <span class="value" id="vertical-rate">--- m/s</span>
            </div>
            <div class="detail-row">
              <span class="label">Squawk</span>
              <span class="value" id="squawk">---</span>
            </div>
            <div class="detail-row">
              <span class="label">ICAO24</span>
              <span class="value" id="icao24">---</span>
            </div>
          </div>
        </div>
      </div>
      <div id="stats">
        <span id="plane-count">0</span> aviones en vuelo
        <span class="separator">|</span>
        <span id="data-source">---</span>
        <span class="separator">|</span>
        <span id="last-update">--:--:--</span>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/api.js?v=3"></script>
    <script src="js/aircraft.js?v=3"></script>
    <script src="js/map.js?v=3"></script>
    <script src="js/app.js?v=3"></script>
  </body>
</html>
