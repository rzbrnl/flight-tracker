<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Flight Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css?v=10" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z'/></svg>" />
  </head>
  <body>
    <!-- Top Bar -->
    <header id="topbar">
      <div class="logo">
        <i class="hgi-stroke hgi-airplane"></i>
        <span>SkyView</span>
      </div>

      <div class="search-wrapper">
        <div class="search-box">
          <i class="hgi-stroke hgi-search-01 search-icon"></i>
          <input type="text" id="search" placeholder="Search flights, airports..." autocomplete="off" />
        </div>
      </div>

      <div class="top-actions">
        <button class="top-btn" id="btn-filters" title="Filters">
          <i class="hgi-stroke hgi-filter"></i>
        </button>
        <button class="top-btn" id="btn-settings" title="Settings">
          <i class="hgi-stroke hgi-settings-01"></i>
        </button>
        <div class="avatar">J</div>
      </div>
    </header>

    <!-- Map -->
    <div id="map"></div>

    <!-- Side Panel -->
    <aside id="sidebar" class="hidden">
      <div class="sidebar-header">
        <span style="font-size: 13px; color: var(--text-muted);">Flight Details</span>
        <button id="close-sidebar" class="close-btn">
          <i class="hgi-stroke hgi-cancel-01"></i>
        </button>
      </div>

      <div class="flight-card">
        <!-- Route -->
        <div class="flight-route">
          <div>
            <div class="airport-code" id="origin-code">---</div>
            <div class="airport-name" id="origin-name">Origin</div>
          </div>
          <div class="route-line">
            <i class="hgi-stroke hgi-airplane"></i>
          </div>
          <div style="text-align: right;">
            <div class="airport-code" id="dest-code">---</div>
            <div class="airport-name" id="dest-name">Destination</div>
          </div>
        </div>

        <!-- Flight Number -->
        <div class="flight-number">
          <i class="hgi-stroke hgi-ticket-01"></i>
          <span id="callsign">---</span>
          <span style="margin-left: auto; color: var(--text-muted); font-size: 11px;" id="country">---</span>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-label"><i class="hgi-stroke hgi-speed-meter"></i> Speed</div>
            <div class="stat-value" id="velocity">--- km/h</div>
          </div>
          <div class="stat-item">
            <div class="stat-label"><i class="hgi-stroke hgi-ruler"></i> Altitude</div>
            <div class="stat-value" id="altitude">--- m</div>
          </div>
          <div class="stat-item">
            <div class="stat-label"><i class="hgi-stroke hgi-navigation"></i> Heading</div>
            <div class="stat-value" id="heading">---°</div>
          </div>
          <div class="stat-item">
            <div class="stat-label"><i class="hgi-stroke hgi-arrow-up-down"></i> Vertical</div>
            <div class="stat-value" id="vertical-rate">--- m/s</div>
          </div>
        </div>

        <!-- More Info -->
        <button class="more-info-btn" id="btn-more-info">
          <i class="hgi-stroke hgi-information-circle"></i>
          More information
        </button>

        <!-- Advanced Info (hidden by default) -->
        <div id="advanced-info" style="display: none; margin-top: 12px;">
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-label"><i class="hgi-stroke hgi-number"></i> Squawk</div>
              <div class="stat-value" id="squawk">---</div>
            </div>
            <div class="stat-item">
              <div class="stat-label"><i class="hgi-stroke hgi-fingerprint-01"></i> ICAO24</div>
              <div class="stat-value mono" id="icao24">---</div>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Bottom Bar -->
    <footer id="bottombar">
      <div class="bottom-stat">
        <i class="hgi-stroke hgi-airplane"></i>
        <span class="value" id="plane-count">0</span>
        <span>flights</span>
      </div>
      <div class="bottom-stat">
        <i class="hgi-stroke hgi-airplane-02"></i>
        <span class="value">20</span>
        <span>airports</span>
      </div>
      <div class="bottom-stat">
        <i class="hgi-stroke hgi-earth"></i>
        <span class="value" id="country-count">0</span>
        <span>countries</span>
      </div>
      <div class="bottom-stat live">
        <i class="hgi-solid hgi-circle-02 pulse"></i>
        <span class="value" id="data-source">Live</span>
      </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/api.js?v=10"></script>
    <script src="js/aircraft.js?v=10"></script>
    <script src="js/map.js?v=10"></script>
    <script src="js/app.js?v=10"></script>
  </body>
</html>
